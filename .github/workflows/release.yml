name: Release Extension Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run extension validation & parser tests
        run: node scripts/validate.js

      - name: Verify version and package extension zip
        id: pkg
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "Error: tag v$TAG_VERSION does not match manifest.json version $VERSION"
              exit 1
            fi
          fi

          ZIP_NAME="dropics-v${VERSION}.zip"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

          zip -r "$ZIP_NAME" \
            manifest.json \
            background.js \
            content.js \
            styles.css \
            popup.html \
            popup.css \
            popup.js \
            icons \
            _locales \
            -x '*.DS_Store'

          ls -lh "$ZIP_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropics-v${{ steps.pkg.outputs.version }}
          path: ${{ steps.pkg.outputs.zip_name }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/RELEASE_TEMPLATE.md
          files: ${{ steps.pkg.outputs.zip_name }}
          generate_release_notes: true
